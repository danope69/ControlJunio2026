plugins {
    id 'java'
    id 'maven-publish'
}

group = 'us.dit.muit.fs'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Log4j 2 - usado en GestorDispositivosCentro y Dispositivo
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.1'

    // JUnit 5 para tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly  'org.junit.jupiter:junit-jupiter-engine:5.10.2'

    // Mockito para mocking en tests
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    // Requerido por Gradle 9.x: launcher de JUnit Platform
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Directorio de fuentes: la carpeta 'java/' en la raíz del proyecto
sourceSets {
    main {
        java {
            srcDirs = ['java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Genera el Javadoc en la carpeta 'recursos/' de la raíz del proyecto
javadoc {
    destinationDir = file("${rootDir}/recursos")
    options.encoding = 'UTF-8'
    options.charSet   = 'UTF-8'
    // Evita que warnings de Javadoc rompan el build
    options.addBooleanOption('Xdoclint:none', true)
}

// Publicación en GitHub Packages
// Las credenciales se leen de variables de entorno — NUNCA se escriben aquí
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            // GAV heredado de group, rootProject.name y version definidos arriba
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            // GITHUB_REPOSITORY se expone automáticamente en GitHub Actions
            url = uri("https://maven.pkg.github.com/${System.env.GITHUB_REPOSITORY ?: 'danope69/ControlJunio2026'}")
            credentials {
                username = System.env.GITHUB_ACTOR   ?: ''
                password = System.env.GITHUB_TOKEN   ?: ''
            }
        }
    }
}
